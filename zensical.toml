[project]

site_name = "Dessert's Guidebook"
site_description = "A comprehensive, self-learning based book for the game Brickadia"
site_author = "DessertSource"
site_url = "https://decoding-the-source.github.io/dessert-brickadia-guide"

repo_url = "https://codeberg.org/decoding-the-source/dessert-brickadia-guide"
repo_name = "dessert-brickadia-guide"

copyright = """
<a href="https://decoding-the-source.github.io/dessert-brickadia-guide/about/license.html">
&copy; 2026 Decoding The Source members & contributors</a>
|
<a href="https://decoding-the-source.github.io/dessert-brickadia-guide/about/privacy-policy.html">
Privacy Policy</a>
"""

watch = [
    "macros.py",
    "docs/assets/javascripts/",
    "docs/assets/stylesheets/",
    "docs/snippets/"
]

nav = [

    { "Home" = "index.md" },

    { "About" = [
        "about/index.md",
        "about/repository.md",
        "about/issues.md",
        "about/contribution.md",
        "about/license.md",
        "about/privacy-policy.md"
    ]},

    { "Essentials" = [
        "essentials/looking-around.md",
        "essentials/movement.md",
        { "Chat" = [
            "essentials/chat/index.md",
            "essentials/chat/chat-formatting.md",
            "essentials/chat/chat-commands.md",
        ]},
        "essentials/emotes.md",
        "essentials/camera-tools.md",
        "essentials/avatar-editor.md",
        "essentials/palette-editor.md",
    ]},

    { "Wires" = [
        { "Basics" = [
            "wires/basics/what-are-wires.md",
            # "wires/basics/what-are-gates.md",
            # "wires/basics/rerouters",   
            "wires/basics/execution-signals.md",
            "wires/basics/wire-appearance.md"
        ]}
    ]},

    { "Library" = [
        # "library/index.md",
        { "Avatar Parts" = [
            "library/avatar-parts/sockets.md",
            "library/avatar-parts/body-parts.md",
            "library/avatar-parts/headwear.md",
            "library/avatar-parts/accessories.md",
            "library/avatar-parts/stickers.md"
        ]},
        { "Entities" = [
            "library/entities/physics-objects.md",
            "library/entities/wheels.md",
        ]},
        { "Bricks" = [
            "library/bricks/bricks.md",
            "library/bricks/ramps.md",
            "library/bricks/rounds.md",
            "library/bricks/special.md",
            "library/bricks/micro-bricks.md",
            "library/bricks/physics.md",
            "library/bricks/mechanics.md",
            "library/bricks/wires-pure.md",
            "library/bricks/wires-exec.md"
        ]},
        # { "Items" = [
        #     "library/items/weapons.md"
        # ]},
        { "Audio" = [
            "library/audio/audio.md",
            "library/audio/one-shot-audio.md",
            "library/audio/items-audio.md",
            "library/audio/wheel-engine-audio.md"
        ]},
        "library/fonts.md"
    ]}

]

extra_css = [
    "assets/stylesheets/extra.css",
]

extra_javascript = [
    "assets/libraries/tex-mml-chtml.js",
    "assets/libraries/tablesort.min.js",
    "assets/libraries/plyr.polyfilled.min.js",
    "assets/javascripts/mathjax.js",
    "assets/javascripts/tablesort.js",
    "assets/javascripts/plyr.js"
]

[project.extra]

polyfills = [
    "assets/libraries/iframe-worker-shim.js"
]

[project.extra.tags]

Meta = "meta"

Essentials = "estl"
Presets = "prst"
Chat = "chat"
Social = "soci"
Movement = "mvmt"
Camera = "camr"
Filming = "film"
Avatars = "avtr"
Palettes = "palt"
Lighting = "lgng"
Formatting = "fmrt"

Components = "cmpo"

Wires = "wire"
"Wire Variables" = "wvar"

Commands = "cmds"

[project.theme.icon.tag]

meta = "lucide/info"

estl = "lucide/star"
prst = "lucide/notepad-text"
chat = "lucide/message-circle-more"
soci = "lucide/message-circle-heart"
mvmt = "lucide/gamepad-directional"
camr = "lucide/camera"
film = "lucide/clapperboard"
avtr = "lucide/shirt"
palt = "lucide/swatch-book"
lgng = "lucide/spotlight"
fmrt = "lucide/type-outline"

cmpo = "lucide/card-sim"

wire = "lucide/cable"
wvar = "lucide/variable"

cmds = "lucide/square-terminal"

[project.theme]

variant = "modern"

logo = "assets/stylesheets/elements/logo.svg"
favicon = "assets/stylesheets/elements/favicon.svg"
icon.repo = "simple/codeberg"

custom_dir = "docs/assets/overrides"

language = "en"

features = [

    "announce.dismiss",
    
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.footnote.tooltips",
    "content.tooltips",

    "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",

    "toc.follow",

    "search.highlight"

]

[project.plugins.offline]
enabled = true

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "indigo"
accent = "indigo"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "indigo"
accent = "indigo"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "indigo"
accent = "indigo"

[project.theme.font]
text = false
code = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/DessertSource/dessert-brickadia-guide"
name = "View the repository for this guide on GitHub"

[[project.extra.social]]
icon = "simple/codeberg"
link = "https://codeberg.org/DessertSource/dessert-brickadia-guide"
name = "View the repository for this guide on Codeberg"

[project.markdown_extensions]

abbr = {}
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}

toc.title = "On this page"
toc.permalink = "¶"
toc.permalink_title = "Anchor link to this section for copying"
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"

tables = {}

pymdownx.arithmatex.generic = true
pymdownx.blocks.caption = {}

pymdownx.caret = {}
pymdownx.mark = {}
pymdownx.tilde = {}

pymdownx.details = {}

pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options.custom_icons = [
  "docs/assets/overrides/.icons",
]

pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"

pymdownx.inlinehilite = {}
pymdownx.keys.key_map = { "asterisk" = "*", "scrollwheel" = "Mouse Scroll Wheel", "leftbutton" = "Left Mouse Button", "middlebutton" = "Middle Mouse Button", "rightbutton" = "Right Mouse Button"}

pymdownx.snippets.auto_append = ["docs/snippets/abbreviations.md"]
pymdownx.snippets.check_paths = true

pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

pymdownx.smartsymbols = { "fractions" = false }

pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify.object = "pymdownx.slugs.slugify"
pymdownx.tabbed.slugify.kwds.case = "lower"

pymdownx.tasklist.custom_checkbox = true

# ensical.extensions.glightbox.auto_caption = true

zensical.extensions.macros.module_name = "macros"
